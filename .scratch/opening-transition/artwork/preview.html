<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opening artwork — Layer alignment study</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #0a121a; }
      main { position: relative; width: 100%; }
      img { display: block; width: 100%; height: auto; }
      .figure { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <main aria-label="Layer alignment study">
      <img src="city-background.png" alt="Original nighttime city with the occluded skyline reconstructed." />
      <img class="figure" src="figure.png" alt="Conceptual figure superimposed in its original lower-right position." />
    </main>
  </body>
</html>
